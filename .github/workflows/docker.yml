name: Docker CI/CD

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'           # trigger en tags de versión: v1.0.0, v2.1.3, etc.
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # Nombre local de la imagen, sin registro. El CI construye, testea y escanea
  # sin necesidad de credenciales; el nombre completo de Docker Hub se arma
  # recién en el job de CD, que sí tiene acceso a los secrets.
  IMAGE_NAME: api-service

jobs:
  # ─────────────────────────────────────────
  # CI — build + test + scan
  # corre en PRs y en push a cualquier rama
  # No requiere secrets: un PR desde un fork también lo ejecuta completo.
  # ─────────────────────────────────────────
  ci:
    name: CI — Build & Test
    runs-on: ubuntu-latest

    outputs:
      # El job de CD lee esta salida para decidir si puede publicar.
      has_dockerhub: ${{ steps.check_secrets.outputs.has_dockerhub }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # El contexto `secrets` no está disponible en el `if` de un job, así que
      # se evalúa acá y se expone como output.
      - name: Check Docker Hub credentials
        id: check_secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "Credenciales presentes: el push a Docker Hub va a ejecutarse."
          else
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "Sin credenciales de Docker Hub: se omite la publicación." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Configura QEMU para builds multi-plataforma (amd64 + arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      # Buildx habilita builds multi-plataforma y caché avanzado
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build de la imagen — sin push todavía
      # Se guarda en caché local del runner para los pasos siguientes
      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true             # carga la imagen en Docker local del runner
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha  # caché entre runs de GitHub Actions
          cache-to: type=gha,mode=max

      # Test de que el contenedor arranca y responde
      - name: Test container health
        run: |
          docker run -d \
            --name test-container \
            -p 8000:8000 \
            -e APP_VERSION=ci-test \
            ${{ env.IMAGE_NAME }}:test

          # Espera hasta 30s a que el health check pase
          echo "Waiting for container to be healthy..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Container is healthy"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "Container failed to start"
              docker logs test-container
              exit 1
            fi
            sleep 2
          done

          # Verificar endpoint raíz
          curl -sf http://localhost:8000/ | grep "ok"

          docker stop test-container
          docker rm test-container

      # Escaneo de vulnerabilidades en la imagen
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          format: 'table'
          exit-code: '1'         # un hallazgo corrige o detiene: el job CD no corre
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true   # sin parche disponible no hay acción posible en este repo

  # ─────────────────────────────────────────
  # SECURITY — secretos, código y dependencias
  # Bloquean el job de CD si encuentran algo.
  # ─────────────────────────────────────────
  secrets-scan:
    name: Secrets — gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0         # gitleaks revisa todo el historial, no solo el último commit

      - name: Scan history with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact --no-banner --verbose

  sast:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan code with Semgrep
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.182.1 \
            semgrep scan --config p/python --config p/dockerfile --metrics=off --error /src

  sca:
    name: SCA — pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Audit dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r app/requirements.txt

  # ─────────────────────────────────────────
  # CD — push a Docker Hub
  # solo en merge a main o en tags de versión
  # ─────────────────────────────────────────
  cd:
    name: CD — Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [ci, secrets-scan, sast, sca]   # publica solo si todo pasa
    # Solo publica si hay credenciales configuradas Y estamos en main o en un tag.
    if: |
      needs.ci.outputs.has_dockerhub == 'true' &&
      ((github.ref == 'refs/heads/main' && github.event_name == 'push') ||
       startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Login a Docker Hub usando secrets del repo
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # usar token, no password

      # Acá sí se arma el nombre con el registro: usuario/imagen
      - name: Resolve registry image name
        id: img
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "name=$DOCKERHUB_USERNAME/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      # Genera los tags automáticamente según el evento
      # Push a main     → imagen:main  +  imagen:sha-abc1234
      # Tag v1.2.3      → imagen:1.2.3  +  imagen:1.2  +  imagen:1  +  imagen:latest
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Build multi-plataforma + push a Docker Hub
      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64   # compatible con Apple Silicon y servidores
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Resumen en la UI de GitHub Actions
      - name: Summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image pushed:** \`${{ steps.img.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
