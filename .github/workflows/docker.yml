name: Docker CI/CD

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'           # trigger en tags de versión: v1.0.0, v2.1.3, etc.
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/api-service

jobs:
  # ─────────────────────────────────────────
  # CI — build + test + scan
  # corre en PRs y en push a cualquier rama
  # ─────────────────────────────────────────
  ci:
    name: CI — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configura QEMU para builds multi-plataforma (amd64 + arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx habilita builds multi-plataforma y caché avanzado
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build de la imagen — sin push todavía
      # Se guarda en caché local del runner para los pasos siguientes
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true             # carga la imagen en Docker local del runner
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha  # caché entre runs de GitHub Actions
          cache-to: type=gha,mode=max

      # Test de que el contenedor arranca y responde
      - name: Test container health
        run: |
          docker run -d \
            --name test-container \
            -p 8000:8000 \
            -e APP_VERSION=ci-test \
            ${{ env.IMAGE_NAME }}:test

          # Espera hasta 30s a que el health check pase
          echo "Waiting for container to be healthy..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Container is healthy"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "Container failed to start"
              docker logs test-container
              exit 1
            fi
            sleep 2
          done

          # Verificar endpoint raíz
          curl -sf http://localhost:8000/ | grep "ok"

          docker stop test-container
          docker rm test-container

      # Escaneo de vulnerabilidades en la imagen
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          format: 'table'
          exit-code: '0'         # no bloquea el pipeline — solo reporta
          severity: 'CRITICAL,HIGH'

  # ─────────────────────────────────────────
  # CD — push a Docker Hub
  # solo en merge a main o en tags de versión
  # ─────────────────────────────────────────
  cd:
    name: CD — Push to Docker Hub
    runs-on: ubuntu-latest
    needs: ci                    # espera que CI pase
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login a Docker Hub usando secrets del repo
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # usar token, no password

      # Genera los tags automáticamente según el evento
      # Push a main     → imagen:main  +  imagen:sha-abc1234
      # Tag v1.2.3      → imagen:1.2.3  +  imagen:1.2  +  imagen:1  +  imagen:latest
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Build multi-plataforma + push a Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64   # compatible con Apple Silicon y servidores
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Resumen en la UI de GitHub Actions
      - name: Summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image pushed:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
